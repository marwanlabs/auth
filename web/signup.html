<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(){const t=localStorage.getItem('authserver-theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="center-page">
    <form class="card" id="signup-form" novalidate>
      <h1>Create your account</h1>
      <p class="subtitle">Get started in a few seconds.</p>

      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" minlength="10" required>

      <button type="submit" id="submit-btn">Create account</button>
      <div class="error-box" id="error-box" hidden></div>

      <p class="footer-link">Already have an account? <a href="/login.html">Sign in</a></p>
    </form>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('signup-form');
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.hidden = true;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';
      try {
        await Auth.signup(form.email.value, form.password.value);
        window.location.href = '/dashboard.html';
      } catch (err) {
        showError(errorBox, err);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
