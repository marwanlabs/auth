<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(){const t=localStorage.getItem('authserver-theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="center-page">
    <form class="card" id="login-form" novalidate>
      <h1>Sign in</h1>
      <p class="subtitle">Welcome back.</p>

      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit" id="submit-btn">Sign in</button>
      <div id="oauth-providers"></div>
      <div class="oauth-divider" hidden><span>or use email</span></div>
      <div class="error-box" id="error-box" hidden></div>

      <p class="footer-link">
        <a href="/reset-request.html">Forgot password?</a> &middot;
        No account? <a href="/signup.html">Sign up</a>
      </p>
    </form>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');

    const oauthError = new URLSearchParams(window.location.search).get('oauth_error');
    if (oauthError) showError(errorBox, oauthError);

    fetch('/api/auth/providers').then(r => r.ok ? r.json() : []).then(providers => {
      const container = document.getElementById('oauth-providers');
      providers.forEach(provider => {
        const link = document.createElement('a');
        link.className = 'oauth-button';
        link.href = '/api/auth/' + encodeURIComponent(provider.id);
        link.textContent = 'Continue with ' + provider.name;
        container.appendChild(link);
      });
      if (providers.length) document.querySelector('.oauth-divider').hidden = false;
    }).catch(() => {});

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.hidden = true;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';
      try {
        await Auth.login(form.email.value, form.password.value);
        window.location.href = '/dashboard.html';
      } catch (err) {
        showError(errorBox, err);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
