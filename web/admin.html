<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manage users</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(){const t=localStorage.getItem('authserver-theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');})();</script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/dashboard.html">Your app</a>
    <a class="admin-link" href="/dashboard.html">Dashboard</a>
  </div>
  <main class="container">
    <div class="panel">
      <h1>Manage users</h1>
      <p class="subtitle">View accounts, change roles, and temporarily disable access.</p>
      <label for="user-search">Search by email</label>
      <input id="user-search" type="search" placeholder="name@example.com">
      <div class="error-box" id="error-box" hidden></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Email</th><th>Role</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
          <tbody id="users-body"><tr><td colspan="5">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="panel provider-panel">
      <h2>Sign-in providers</h2>
      <p class="subtitle">Control which social providers users can sign in with and see what still needs configuring. Credentials never leave the server.</p>
      <div class="error-box" id="providers-error" hidden></div>
      <div id="providers-list" aria-live="polite"><p>Loading…</p></div>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script>
    const body = document.getElementById('users-body');
    const search = document.getElementById('user-search');
    const errorBox = document.getElementById('error-box');
    let users = [];

    function render() {
      const query = search.value.trim().toLowerCase();
      const visible = users.filter(u => u.email.includes(query));
      body.innerHTML = '';
      if (!visible.length) { body.innerHTML = '<tr><td colspan="5">No users found.</td></tr>'; return; }
      for (const user of visible) {
        const row = document.createElement('tr');
        const email = document.createElement('td'); email.textContent = user.email;
        const role = document.createElement('td');
        const select = document.createElement('select');
        for (const option of ['user', 'admin']) select.add(new Option(option, option, false, user.role === option));
        select.disabled = user.id === window.currentAdminID;
        select.addEventListener('change', () => updateRole(user, select.value));
        role.appendChild(select);
        const status = document.createElement('td');
        const statusBadge = document.createElement('span');
        statusBadge.className = user.disabled ? 'status disabled' : 'status';
        statusBadge.textContent = user.disabled ? 'Disabled' : 'Active';
        status.appendChild(statusBadge);
        const created = document.createElement('td'); created.textContent = new Date(user.created_at).toLocaleString();
        const actions = document.createElement('td');
        const actionGroup = document.createElement('div');
        actionGroup.className = 'actions';
        const button = document.createElement('button');
        button.className = user.disabled ? 'action-link' : 'action-link';
        button.textContent = user.disabled ? 'Enable' : 'Disable';
        button.disabled = user.id === window.currentAdminID;
        button.addEventListener('click', () => updateStatus(user, !user.disabled));
        actionGroup.appendChild(button);
        const deleteButton = document.createElement('button');
        deleteButton.className = 'delete-link';
        deleteButton.textContent = 'Delete';
        deleteButton.disabled = user.id === window.currentAdminID;
        deleteButton.addEventListener('click', () => deleteUser(user));
        actionGroup.appendChild(deleteButton);
        actions.appendChild(actionGroup);
        row.append(email, role, status, created, actions);
        body.appendChild(row);
      }
    }
    async function updateRole(user, role) {
      if (!confirm(`Change ${user.email} to ${role}?`)) { render(); return; }
      try { await Auth.changeUserRole(user.id, role); await load(); } catch (err) { showError(errorBox, err); render(); }
    }
    async function updateStatus(user, disabled) {
      const action = disabled ? 'disable' : 'enable';
      if (!confirm(`${action[0].toUpperCase() + action.slice(1)} ${user.email}?`)) return;
      try { await Auth.changeUserStatus(user.id, disabled); await load(); } catch (err) { showError(errorBox, err); }
    }
    async function deleteUser(user) {
      if (!confirm(`Permanently delete ${user.email}? This removes their sessions and cannot be undone.`)) return;
      try { await Auth.deleteUser(user.id); await load(); } catch (err) { showError(errorBox, err); }
    }
    async function load() {
      try { users = await Auth.listUsers(); errorBox.hidden = true; render(); }
      catch (_) { window.location.href = '/dashboard.html'; }
    }
    const PROVIDER_ENV = {
      google: 'AUTH_GOOGLE', facebook: 'AUTH_FACEBOOK', github: 'AUTH_GITHUB',
      microsoft: 'AUTH_MICROSOFT', apple: 'AUTH_APPLE', gitlab: 'AUTH_GITLAB',
      discord: 'AUTH_DISCORD', linkedin: 'AUTH_LINKEDIN', twitter: 'AUTH_TWITTER',
      oidc: 'AUTH_OIDC',
    };
    const REQUIREMENT_LABEL = {
      client_id: 'Client ID',
      client_secret: 'Client secret',
      redirect_url: 'Callback URL',
      issuer: 'Issuer URL',
    };
    const REQUIREMENT_ENV = {
      client_id: 'CLIENT_ID',
      client_secret: 'CLIENT_SECRET',
      redirect_url: 'REDIRECT_URL',
      issuer: 'ISSUER',
    };
    const providersList = document.getElementById('providers-list');
    const providersError = document.getElementById('providers-error');
    let providers = [];

    function providerState(provider) {
      if (provider.ready) {
        return {
          cls: 'ready',
          label: 'Ready',
          hint: provider.enabled
            ? 'Enabled · users can sign in with it now'
            : 'Configured · enable below to offer it on the sign-in page',
        };
      }
      return {
        cls: 'incomplete',
        label: 'Incomplete',
        hint: 'Not ready yet · add the missing configuration below to enable',
      };
    }

    function providerMissingEnv(provider, requirement) {
      const suffix = REQUIREMENT_ENV[requirement] || requirement.replace(/_/g, '-').toUpperCase();
      return (PROVIDER_ENV[provider.id] || 'AUTH') + '_' + suffix;
    }

    function buildMissingList(provider) {
      const missing = document.createElement('div');
      missing.className = 'provider-missing';
      const note = document.createElement('p');
      note.append('Add the following environment variables, then restart the server (see the ');
      const readme = document.createElement('a');
      readme.href = 'https://github.com/marwanlabs/auth/blob/main/README.md';
      readme.textContent = 'README';
      note.append(readme, '):');
      missing.appendChild(note);
      const ul = document.createElement('ul');
      for (const requirement of provider.missing_requirements || []) {
        const li = document.createElement('li');
        li.append((REQUIREMENT_LABEL[requirement] || requirement) + ': ');
        const env = document.createElement('code');
        env.textContent = providerMissingEnv(provider, requirement);
        li.appendChild(env);
        ul.appendChild(li);
      }
      missing.appendChild(ul);
      return missing;
    }

    function setFeedback(el, message, kind) {
      el.textContent = message;
      el.hidden = false;
      el.setAttribute('role', kind === 'error' ? 'alert' : 'status');
      el.classList.toggle('error', kind === 'error');
      el.classList.toggle('success', kind === 'success');
    }

    function renderProviders() {
      providersList.innerHTML = '';
      if (!providers.length) {
        providersList.textContent = 'No providers are configured.';
        return;
      }
      for (const provider of providers) {
        const state = providerState(provider);
        const row = document.createElement('div');
        row.className = 'provider-row';
        const info = document.createElement('div');
        info.className = 'provider-info';
        const nameLine = document.createElement('div');
        nameLine.className = 'provider-name-line';
        const name = document.createElement('strong');
        name.textContent = provider.name;
        const badge = document.createElement('span');
        badge.className = 'provider-state ' + state.cls;
        badge.textContent = state.label;
        nameLine.append(name, badge);
        const hint = document.createElement('small');
        hint.textContent = state.hint;
        info.append(nameLine, hint);
        if (provider.missing_requirements && provider.missing_requirements.length) {
          info.appendChild(buildMissingList(provider));
        }
        const feedback = document.createElement('p');
        feedback.className = 'provider-feedback';
        feedback.hidden = true;
        info.appendChild(feedback);
        row.appendChild(info);
        const toggle = document.createElement('button');
        toggle.className = 'provider-toggle secondary';
        toggle.type = 'button';
        toggle.textContent = provider.enabled ? 'Enabled' : 'Disabled';
        toggle.disabled = !provider.ready;
        toggle.setAttribute('aria-pressed', String(provider.enabled));
        if (!provider.ready) toggle.title = 'Configure the provider, then enable it';
        toggle.addEventListener('click', () => toggleProvider(provider, toggle, feedback, hint, badge));
        row.appendChild(toggle);
        providersList.appendChild(row);
      }
    }

    async function toggleProvider(provider, toggle, feedback, hint, badge) {
      const next = !provider.enabled;
      toggle.disabled = true;
      toggle.setAttribute('aria-busy', 'true');
      toggle.textContent = next ? 'Enabling…' : 'Disabling…';
      try {
        const result = await Auth.setProvider(provider.id, next);
        provider.enabled = result.enabled;
        const state = providerState(provider);
        hint.textContent = state.hint;
        badge.textContent = state.label;
        toggle.textContent = provider.enabled ? 'Enabled' : 'Disabled';
        toggle.setAttribute('aria-pressed', String(provider.enabled));
        setFeedback(feedback, provider.name + (provider.enabled ? ' enabled' : ' disabled'), 'success');
      } catch (err) {
        toggle.textContent = provider.enabled ? 'Enabled' : 'Disabled';
        setFeedback(feedback, err.message || String(err), 'error');
      } finally {
        toggle.disabled = false;
        toggle.removeAttribute('aria-busy');
      }
    }

    async function loadProviders() {
      try {
        providers = await Auth.listAdminProviders();
        providersError.hidden = true;
        renderProviders();
      } catch (err) {
        providersList.innerHTML = '<p>Could not load providers.</p>';
        showError(providersError, err);
      }
    }
    search.addEventListener('input', render);
    (async () => {
      try {
        const me = await Auth.me();
        if (me.role !== 'admin') { window.location.href = '/dashboard.html'; return; }
        window.currentAdminID = me.id;
        await load();
        await loadProviders();
      } catch (_) { window.location.href = '/login.html'; }
    })();
  </script>
</body>
</html>
